name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: square-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Square Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - name: Check the build environment
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_TURNSTILE_SITE_KEY \
            NEXT_PUBLIC_VAPID_PUBLIC_KEY TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET \
            SQUARE_TOKEN SQUARE_APPLICATION_ID; do
            if [ -z "${!name:-}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::missing or empty repository secrets:${missing}"
            exit 1
          fi
          case "${NEXT_PUBLIC_SITE_URL}" in
            https://*) ;;
            *) echo "::error::NEXT_PUBLIC_SITE_URL is not an https origin"; exit 1 ;;
          esac
          case "${NEXT_PUBLIC_SITE_URL}" in
            *localhost*|*127.0.0.1*|*.vercel.app*)
              echo "::error::NEXT_PUBLIC_SITE_URL points at a development origin"
              exit 1
              ;;
          esac
          if [ -n "${ULOGGD_E2E:-}" ]; then
            echo "::error::ULOGGD_E2E is set; the harness routes and catalogue fixtures must never ship"
            exit 1
          fi
          echo "build environment complete"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and assemble the deploy tree
        run: bash scripts/package-square.sh

      - name: Verify the deploy tree
        run: |
          required='
          squarecloud.app
          server.js
          .next/standalone/server.js
          .next/standalone/.next/static
          .next/standalone/public
          .next/standalone/node_modules/@img/sharp-linux-x64/lib
          '
          for entry in $required; do
            if [ ! -e "square-deploy/${entry}" ]; then
              echo "::error::deploy tree is missing ${entry}"
              exit 1
            fi
          done
          img=square-deploy/.next/standalone/node_modules/@img
          if ls "$img" 2>/dev/null | grep -qE 'win32|darwin'; then
            echo '::error::deploy tree carries a non-linux sharp binary'
            exit 1
          fi
          if ! head -c 4 "$img"/sharp-linux-x64/lib/*.node | od -An -tx1 | grep -q '7f 45 4c 46'; then
            echo '::error::the packaged sharp binary is not an ELF object'
            exit 1
          fi
          du -sh square-deploy

      - name: Upload the deploy tree as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: square-deploy
          path: square-deploy
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Install the Square Cloud CLI
        uses: squarecloudofc/github-action@v2
        with:
          token: ${{ secrets.SQUARE_TOKEN }}
          install-only: true

      - name: Commit to Square Cloud
        working-directory: square-deploy
        env:
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
        run: |
          deploy_count() {
            local raw count
            raw="$(squarecloud app deploy list "${SQUARE_APPLICATION_ID}" --json 2>/dev/null)" || raw=''
            count="$(printf '%s' "${raw}" | jq -r '[.[][].id] | unique | length' 2>/dev/null || true)"
            case "${count}" in
              ''|*[!0-9]*) echo unknown ;;
              *) echo "${count}" ;;
            esac
          }
          before="$(deploy_count)"
          echo "distinct deploys before: ${before}"
          delay=20
          attempt=1
          while [ "${attempt}" -le 3 ]; do
            if squarecloud commit "${SQUARE_APPLICATION_ID}" --restart; then
              echo "commit accepted on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::commit attempt ${attempt} failed"
            if [ "${attempt}" -eq 3 ]; then
              break
            fi
            sleep "${delay}"
            after="$(deploy_count)"
            echo "distinct deploys after: ${after}"
            if [ "${before}" != unknown ] && [ "${after}" != unknown ] && [ "${after}" != "${before}" ]; then
              echo '::notice::the upload landed despite the client error; not retrying'
              exit 0
            fi
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo '::error::commit failed after 3 attempts'
          exit 1
