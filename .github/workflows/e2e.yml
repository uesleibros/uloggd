name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Everything that needs neither a browser nor a database, in its own job so
  # it reports in a minute instead of behind a fifteen-minute suite. It was
  # missing entirely: the workflow ran the browser tests and nothing else, so a
  # type error reached main under a green tick.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The route types are generated, not written: PageProps, LayoutProps and
      # RouteContext come from .next/types, so a bare tsc in a fresh checkout
      # fails on every page in the app. Typegen makes them without paying for
      # a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      # The signed-in specs create a throwaway account, act as it, and delete
      # it. Without this key they skip rather than fail, so the suite still
      # means something on a fork or before the secret is set.
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Every page the site draws reads the database through this, and the
      # runner had no value for it: the server came up, every read failed, and
      # the suite reported twenty missing headings and 500s from share cards
      # rather than the one thing that was wrong. Unset, the guard below says
      # so and stops, instead of spending fifteen minutes proving it.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Only the database tests use it, and they are not run here, but a
      # missing value would be the same silent shape as above.
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The suite runs against the real project, so without a database there
      # is nothing to test and every spec fails for the same reason. Saying it
      # here costs a second; finding it in twenty unrelated failures costs an
      # afternoon.
      - name: Check the database is reachable
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set for this repository, and the end-to-end suite reads the real project through it. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
